name: Build Windows PC Release (Zero-Latency Custom)

on:
  workflow_dispatch:
  push:
    branches: [ "master", "main" ]

jobs:
  build-windows-portable:
    name: Windows PC Pure Green Portable ZIP (Zero-Latency)
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - name: ✅ Checkout Code
        uses: actions/checkout@v4

      - name: ✅ Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: ✅ Resolve Packages
        run: flutter pub get --enforce-lockfile

      - name: ✅ Prefetch Verified Firebase C++ SDK
        shell: pwsh
        run: .\tool\prefetch_windows_native.ps1

      - name: ✅ Generate Production AppConfig
        shell: pwsh
        run: |
          dart run enven `
            --env-files .env,.env.prod `
            --class-name AppConfig

      - uses: ./.github/actions/get-version
        id: version

      - name: ✅ Build Windows x64 Portable Release
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          flutter build windows --release

      - name: ✅ Package Pure Green Portable ZIP (Self-Contained AppData)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = "${{ steps.version.outputs.artifact_version }}"
          $bundle = "build\windows\x64\runner\Release"
          if (!(Test-Path $bundle -PathType Container)) {
            Write-Error "Windows release bundle not found: $bundle"
          }

          $portable = "PureLive-$version-ZeroLatency-windows-x64-portable.zip"
          $temporary = Join-Path $env:RUNNER_TEMP "PureLive-Portable"
          Remove-Item $temporary -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $temporary -Force | Out-Null

          Get-ChildItem $bundle -Force |
            Where-Object {
              $_.Name -notin @("AppData", "IPTV_CACHE")
            } |
            Copy-Item -Destination $temporary -Recurse -Force

          # Pre-create the local AppData structure inside the portable folder
          $localAppData = Join-Path $temporary "AppData"
          New-Item -ItemType Directory -Path (Join-Path $localAppData "Roaming") -Force | Out-Null
          New-Item -ItemType Directory -Path (Join-Path $localAppData "Local") -Force | Out-Null
          New-Item -ItemType Directory -Path (Join-Path $localAppData "TEMP") -Force | Out-Null
          New-Item -ItemType Directory -Path (Join-Path $localAppData "WebView2") -Force | Out-Null

          Compress-Archive `
            -Path (Join-Path $temporary "*") `
            -DestinationPath $portable `
            -CompressionLevel Optimal `
            -Force

          Get-ChildItem $portable | Format-Table Name, Length

      - name: 📦 Upload Windows PC Pure Portable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: pure-live-windows-x64-zero-latency-portable
          path: PureLive-*-ZeroLatency-windows-x64-portable.zip
          if-no-files-found: error
