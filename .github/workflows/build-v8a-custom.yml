name: Build v8a Release APK (Zero-Latency Custom)

on:
  workflow_dispatch:
  push:
    branches: [ "master", "main" ]

jobs:
  build-android-release-v8a:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GRADLE_OPTS: -Dorg.gradle.configuration-cache=false

    steps:
      - name: ✅ Checkout Code
        uses: actions/checkout@v4

      - name: ✅ Setup Java 26
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '26'
          cache: 'gradle'

      - name: ✅ Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: ✅ Create Signing Configuration
        run: |
          keytool -genkey -v -keystore android/app/upload-keystore.jks \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -alias upload \
            -dname "CN=Android Debug,O=Android,C=US" \
            -storepass android -keypass android

          echo "storePassword=android" > android/key.properties
          echo "keyPassword=android" >> android/key.properties
          echo "keyAlias=upload" >> android/key.properties
          echo "storeFile=upload-keystore.jks" >> android/key.properties

      - name: ✅ Get Dependencies
        run: flutter pub get --enforce-lockfile

      - name: ✅ Generate Production AppConfig
        run: |
          dart run enven \
            --env-files .env,.env.prod \
            --class-name AppConfig

      - name: ✅ Build Slim Split APK (arm64-v8a)
        run: |
          flutter build apk --release --split-per-abi \
            --target-platform android-arm64 \
            --split-debug-info=build/app/outputs/symbols \
            --obfuscate

      - name: ✅ Verify APK Size
        run: ls -lh build/app/outputs/flutter-apk/

      - name: 📦 Upload arm64-v8a Slim APK Only
        uses: actions/upload-artifact@v4
        with:
          name: pure-live-arm64-v8a-zero-latency-slim-apk
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          if-no-files-found: error
