name: Build v8a Release APK (Zero-Latency Custom)

on:
  workflow_dispatch:
  push:
    branches: [ "master", "main" ]

jobs:
  build-android-release-v8a:
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: ✅ Checkout Code
        uses: actions/checkout@v4

      # 1. 配置 Java 26 + Gradle 缓存 (适配最新版 Gradle 9.5 / AGP 9.3)
      - name: ✅ Setup Java 26
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: "26"
          cache: 'gradle'

      # 2. 配置 Flutter + SDK 缓存
      - name: ✅ Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # 3. 自动生成签名 (保留自原仓库的免 Secret 自动签名逻辑)
      - name: ✅ Create Signing Configuration
        run: |
          KEYSTORE_FILE="${GITHUB_WORKSPACE}/android/app/upload-keystore.jks"
          rm -f "${KEYSTORE_FILE}"
          keytool -genkey -v \
            -keystore "${KEYSTORE_FILE}" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -alias upload \
            -storepass android \
            -keypass android \
            -dname "CN=GitHub Actions, OU=CI, O=PureLive, L=Cloud, S=Auto, C=US"

          cat > android/key.properties << EOF
          storeFile=${KEYSTORE_FILE}
          storePassword=android
          keyPassword=android
          keyAlias=upload
          EOF

          echo "✅ Keystore created at: ${KEYSTORE_FILE}"

      - name: ✅ Get Dependencies
        run: flutter pub get --enforce-lockfile

      - name: ✅ Generate Production AppConfig
        run: |
          dart run enven \
            --env-files .env,.env.prod \
            --class-name AppConfig

      - name: ✅ Build Split APKs (arm64-v8a)
        env:
          GRADLE_OPTS: -Dorg.gradle.configuration-cache=false
        run: |
          flutter build apk --release \
            --split-per-abi \
            --target-platform android-arm64 \
            --dart-define=PURELIVE_BUILD_SOURCE=github-custom-zero-latency

      - name: ✅ Verify APKs
        run: |
          echo "📦 Generated APK files:"
          ls -lh build/app/outputs/flutter-apk/*.apk

      - name: 📦 Upload arm64-v8a APK Only
        uses: actions/upload-artifact@v4
        with:
          name: pure-live-arm64-v8a-zero-latency-release
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          if-no-files-found: error
